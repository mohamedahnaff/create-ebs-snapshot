---
- name: Update ServiceNow on snapshot success
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Look up RITM by number
      ansible.builtin.uri:
        url: "{{ snow_instance_url | regex_replace('/+$', '') }}/api/now/table/sc_req_item?sysparm_query=number={{ ritm_number }}&sysparm_limit=1&sysparm_fields=sys_id,number"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        validate_certs: true
        headers:
          Accept: "application/json"
        status_code: 200
      register: snow_lookup

    - name: Fail if RITM is not found
      ansible.builtin.fail:
        msg: "RITM {{ ritm_number }} not found in ServiceNow or access is restricted."
      when: snow_lookup.json.result | length == 0

    - name: Set resolved ServiceNow sys_id
      ansible.builtin.set_fact:
        resolved_sys_id: "{{ snow_lookup.json.result[0].sys_id }}"

    - name: Update RITM with success details
      ansible.builtin.uri:
        url: "{{ snow_instance_url | regex_replace('/+$', '') }}/api/now/table/sc_req_item/{{ resolved_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        validate_certs: true
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          work_notes: >-
            EBS snapshot automation completed successfully.
            RITM={{ ritm_number }},
            Instance={{ instance_id }},
            Region={{ region }},
            Snapshot IDs={{ snapshot_ids | join(', ') }}
          u_snapshot_status: "SUCCESS"
          u_snapshot_ids: "{{ snapshot_ids | join(',') }}"
        status_code: 200
      register: snow_success_update

    - name: Show ServiceNow success response
      ansible.builtin.debug:
        var: snow_success_update.json
