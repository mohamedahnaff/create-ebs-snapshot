---
- name: Update ServiceNow on snapshot success
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    snow_instance_url: "https://dev222810.service-now.com"
    snow_username: "admin"
    snow_password: "p**XYDv2R5vx"

  tasks:
    - name: Look up Change Request by CR number
      ansible.builtin.uri:
        url: "{{ snow_instance_url | regex_replace('/+$', '') }}/api/now/table/change_request?sysparm_query=number={{ cr_number }}&sysparm_limit=1&sysparm_fields=sys_id,number"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        validate_certs: true
        headers:
          Accept: "application/json"
        status_code: 200
      register: snow_lookup

    - name: Fail if Change Request is not found
      ansible.builtin.fail:
        msg: "Change Request {{ cr_number }} not found in ServiceNow or access is restricted."
      when: snow_lookup.json.result | length == 0

    - name: Set resolved ServiceNow sys_id
      ansible.builtin.set_fact:
        resolved_sys_id: "{{ snow_lookup.json.result[0].sys_id }}"

    - name: Update Change Request with success details
      ansible.builtin.uri:
        url: "{{ snow_instance_url | regex_replace('/+$', '') }}/api/now/table/change_request/{{ resolved_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        validate_certs: true
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          work_notes: >-
            EBS snapshot automation completed successfully.
            CR={{ cr_number }},
            Instance={{ instance_id }},
            Region={{ region }},
            Snapshot IDs={{ snapshot_ids | join(', ') }}
          u_snapshot_status: "SUCCESS"
          u_snapshot_ids: "{{ snapshot_ids | join(',') }}"
          state: "REVIWE"
        status_code: 200
      register: snow_success_update

    - name: Show ServiceNow success response
      ansible.builtin.debug:
        var: snow_success_update.json
