---
- name: Precheck EC2 and collect attached EBS volumes
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    region: "{{ region | default(aws_region_default) }}"

  tasks:
    - name: Validate mandatory inputs
      ansible.builtin.fail:
        msg: "Missing mandatory input: instance_id or region"
      when: >
        (instance_id is not defined or instance_id | length == 0) or
        (region is not defined or region | length == 0)

    - name: Gather EC2 instance info
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        instance_ids:
          - "{{ instance_id }}"
      register: ec2_info

    - name: Fail if instance not found
      ansible.builtin.fail:
        msg: "EC2 instance {{ instance_id }} not found in region {{ region }}"
      when: ec2_info.instances | length == 0

    - name: Capture EC2 state
      ansible.builtin.set_fact:
        ec2_state: "{{ ec2_info.instances[0].state.name }}"

    - name: Fail if EC2 instance state is invalid
      ansible.builtin.fail:
        msg: "EC2 instance {{ instance_id }} is in invalid state: {{ ec2_state }}"
      when: ec2_state not in ['running', 'stopped']

    - name: Extract attached volume IDs
      ansible.builtin.set_fact:
        volume_ids: >-
          {{
            ec2_info.instances[0].block_device_mappings
            | map(attribute='ebs.volume_id')
            | list
          }}

    - name: Fail if no EBS volumes are attached
      ansible.builtin.fail:
        msg: "No EBS volumes attached to EC2 instance {{ instance_id }}"
      when: volume_ids | length == 0

    - name: Publish workflow artifacts for downstream jobs
      ansible.builtin.set_stats:
        data:
          cr_number: "{{ cr_number }}"
          servicenow_sys_id: "{{ servicenow_sys_id }}"
          instance_id: "{{ instance_id }}"
          region: "{{ region }}"
          env_name: "{{ env_name | default('unknown') }}"
          ec2_state: "{{ ec2_state }}"
          volume_ids: "{{ volume_ids }}"

    - name: Show precheck results
      ansible.builtin.debug:
        msg:
          - "CR Number      : {{ cr_number }}"
          - "ServiceNow SYS : {{ servicenow_sys_id }}"
          - "EC2 Instance   : {{ instance_id }}"
          - "Region         : {{ region }}"
          - "Environment    : {{ env_name | default('unknown') }}"
          - "EC2 State      : {{ ec2_state }}"
          - "Volume IDs     : {{ volume_ids }}"
