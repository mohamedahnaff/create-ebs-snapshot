---
- name: Update ServiceNow on snapshot failure
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    snow_instance_url: "https://dev222810.service-now.com"
    snow_username: "admin"
    snow_password: "p**XYDv2R5vx"
    failure_message: "{{ failure_message | default('Snapshot workflow failed. Review AAP job output.') }}"

  tasks:
    - name: Look up Change Request by CR number
      ansible.builtin.uri:
        url: "{{ snow_instance_url | regex_replace('/+$', '') }}/api/now/table/change_request?sysparm_query=number={{ cr_number }}&sysparm_limit=1&sysparm_fields=sys_id,number"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        validate_certs: true
        headers:
          Accept: "application/json"
        status_code: 200
      register: snow_lookup

    - name: Fail if Change Request is not found
      ansible.builtin.fail:
        msg: "Change Request {{ cr_number }} not found in ServiceNow or access is restricted."
      when: snow_lookup.json.result | length == 0

    - name: Set resolved ServiceNow sys_id
      ansible.builtin.set_fact:
        resolved_sys_id: "{{ snow_lookup.json.result[0].sys_id }}"

    - name: Update Change Request with failure details
      ansible.builtin.uri:
        url: "{{ snow_instance_url | regex_replace('/+$', '') }}/api/now/table/change_request/{{ resolved_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        validate_certs: true
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          work_notes: >-
            EBS snapshot automation failed.
            CR={{ cr_number }},
            Instance={{ instance_id | default('N/A') }},
            Region={{ region | default('N/A') }},
            Error={{ failure_message }}
          u_snapshot_status: "FAILED"
        status_code: 200
      register: snow_failure_update

    - name: Show ServiceNow failure response
      ansible.builtin.debug:
        var: snow_failure_update.json
